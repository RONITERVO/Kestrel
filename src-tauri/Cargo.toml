[package]
name = "kestrel-local"
version = "0.9.0"
description = "Transparent local model control and durable offline research"
authors = ["Kestrel contributors"]
edition = "2021"

[lib]
name = "kestrel_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
html-escape = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled-full"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
portpicker = "0.1"
tauri = { version = "2.8", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["time", "process", "macros", "sync", "io-util"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
