[package]
name = "kestrel-local"
version = "0.14.0"
description = "Local model control, durable offline research, and agent-directed H3 movie production"
authors = ["Kestrel contributors"]
edition = "2021"

[lib]
name = "kestrel_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
html-escape = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled-full"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
walkdir = "2"
portpicker = "0.1"
pdf-extract = "0.12"
quick-xml = "0.38"
rfd = { version = "0.17", default-features = false }
tauri = { version = "2.8", default-features = false, features = ["wry"] }
thiserror = "2"
tokio = { version = "1", features = ["time", "process", "macros", "sync", "io-util", "fs"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[dev-dependencies]
lopdf = "0.42"
tempfile = "3"
