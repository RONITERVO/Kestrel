name: Verify boundaries and application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ui:
    name: UI without Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run ui:check
      - run: npm test -- --run
      - run: npm run build

  native:
    name: Windows native and generated contracts
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install the verified Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.92.0
      - run: npm ci
      - run: git diff --check
      - run: cargo test --all-targets --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: npm run check
      - run: npm test -- --run
      - run: npm run build

      # GPU/model/archive acceptance is producer-triggered on installed local services,
      # not simulated by a hosted runner. See README.md and docs/UI_BOUNDARIES.md.
