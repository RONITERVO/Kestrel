[package]
name = "kestrel-app-core"
version = "0.17.0"
edition = "2021"
description = "Rust-owned durable application contracts and policies for Kestrel"

[dependencies]
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings", "serde-json-impl"] }
